appId: com.smind.local
productName: SMind
# ---- 自动更新（electron-updater）----
# **更新源 = OSS 镜像 `https://dl.smindapp.cn/`（generic provider）**。
#
# 沿革：0.9.1 用的是 GitHub Releases 固定直链（`releases/latest/download/`）——那时 R2 要绑
# 支付方式、Cloudflare 那条路搁置了。镜像就绪后按 `docs/release-mirror.md` 切回 OSS，
# 并在 2026-09-21 用本机 8099 做过一次完整回环验证（发现新版 / 差分 / 篡改拒绝 / 降级 /
# 404 / 坏清单六条都跑过，见 `docs/auto-update-test-plan.md` 的 D2 记录）。
#
# ⚠️ 三个前提，缺一个更新链路就不通：
#   1. 发版时必须把 **exe、`latest.yml`、`*.blockmap` 一起传到镜像根目录**（同名）；
#      预发布版本（`0.9.2-rt.1` 这类）生成的是 `rt.yml`，客户端按 channel 去取，别只传 exe；
#   2. 镜像上的 `latest.yml` 必须指向**最新那一版**（回滚时同步换，客户端不会自动降级）；
#   3. 换版本时把**上一版的 blockmap 留在根目录**，差分下载才生效（缺了就退全量：慢，但不报错）。
#
# 更新地址写在打包产物 `resources/app-update.yml` 里 —— 改这里**必须重新打包**才生效。
publish:
  provider: generic
  url: https://dl.smindapp.cn/
# ---- 代码签名（Azure Trusted Signing，商业化计划选定的方案）----
# 证书开通后设三个环境变量再打包即可，**不用改这份文件**：
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
# 并在此处（win: 之下）加：
#   azureSignOptions:
#     publisherName: <Azure 身份里显示的发布者名，必须逐字一致>
# 没签名时打包照常成功（forceCodeSigning 保持关闭）；签名影响的是 SmartScreen 信誉，
# 与自动更新是否可用互不阻塞——两者别混为一谈。
# 把 .xmind 关联到本软件：装完之后在资源管理器里双击 .xmind 就能直接打开
# （只有**安装版**会注册关联，免安装版没有这一步；不注册的话双击会被系统推给别人或直接报"无法打开"）
fileAssociations:
  - ext: xmind
    name: SMind 思维导图
    description: SMind 思维导图（Xmind 兼容格式）
    icon: build/icon.ico
    role: Editor
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,.github}/**'
  - '!src/**'
  - '!scripts/**'
  - '!samples/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!*.md'
asar: true
win:
  # 由 npm run icon 生成（自绘的多尺寸 ico，含 16/24/32/48/64/128/256）
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 只作为兜底；两个目标各自覆盖，避免它们生成同名文件互相覆盖
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 安装版
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMind
portable:
  # 免安装版（绿色版），与安装版分开放，否则后构建的会覆盖前一个
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
