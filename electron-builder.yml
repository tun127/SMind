appId: com.smind.local
productName: SMind
# ---- 自动更新（electron-updater）----
# **更新源 = 自己的镜像（generic provider）**，不是 GitHub API。
#
# 为什么换掉 github provider（实测依据）：它走 GitHub API，匿名额度 60 次/小时/**IP**，
# 国内共享出口 IP 实测已返回 403 `API rate limit exceeded`——而更新检查**失败是静默的**，
# 失效了你根本不会知道。generic provider 只是对一个 URL 做 GET，指向 Cloudflare R2
# （无 API、无速率限制、国内快），稳定性完全在自己手里。
#
# ⚠️ 两个前提，缺一个更新链路就不通：
#   1. `npm run mirror` 必须把 **latest.yml + *.blockmap** 一起传上去（脚本已支持，缺了会打警告）；
#   2. Release 正文写清这版改了什么（latest.yml 的 releaseNotes 会显示在「发现新版本」对话框里）。
# 若某次要临时回到 GitHub：把下面两行换成
#   provider: github / owner: tun127 / repo: SMind
# 即可——客户端不用改，electron-updater 原生支持两种 provider（配置由打包时生成的
# app-update.yml 决定，所以**改了这里必须重新打包**才会生效）。
publish:
  provider: generic
  url: https://dl.smindapp.cn/
# ---- 代码签名（Azure Trusted Signing，商业化计划选定的方案）----
# 证书开通后设三个环境变量再打包即可，**不用改这份文件**：
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
# 并在此处（win: 之下）加：
#   azureSignOptions:
#     publisherName: <Azure 身份里显示的发布者名，必须逐字一致>
# 没签名时打包照常成功（forceCodeSigning 保持关闭）；签名影响的是 SmartScreen 信誉，
# 与自动更新是否可用互不阻塞——两者别混为一谈。
# 把 .xmind 关联到本软件：装完之后在资源管理器里双击 .xmind 就能直接打开
# （只有**安装版**会注册关联，免安装版没有这一步；不注册的话双击会被系统推给别人或直接报"无法打开"）
fileAssociations:
  - ext: xmind
    name: SMind 思维导图
    description: SMind 思维导图（Xmind 兼容格式）
    icon: build/icon.ico
    role: Editor
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,.github}/**'
  - '!src/**'
  - '!scripts/**'
  - '!samples/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!*.md'
asar: true
win:
  # 由 npm run icon 生成（自绘的多尺寸 ico，含 16/24/32/48/64/128/256）
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 只作为兜底；两个目标各自覆盖，避免它们生成同名文件互相覆盖
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 安装版
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMind
portable:
  # 免安装版（绿色版），与安装版分开放，否则后构建的会覆盖前一个
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
