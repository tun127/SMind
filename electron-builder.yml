appId: com.mindmap.local
productName: 思维导图
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,.github}/**'
  - '!src/**'
  - '!scripts/**'
  - '!samples/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!*.md'
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 思维导图
