appId: com.smind.local
productName: SMind
# ---- 自动更新（electron-updater）----
# **更新源 = GitHub Releases 的固定直链（generic provider）**。
#
# 为什么是 GitHub 直链（2026-09-20 决定）：Cloudflare R2 激活**必须绑支付方式**
# （免费额度内不扣费，但不绑就开不了），当前没有可用信用卡 → R2 暂时搁置。
# 直链走 generic provider，只是对一个 URL 做 GET，**不走 GitHub API**，
# 所以没有「匿名额度 60 次/小时按 IP 限流 → 403」那个坑（那才是当初想换掉 github provider
# 的原因，实测本机出口 IP 已 403）；而 `releases/latest/download/` 是**版本无关的固定 URL**，
# 发新版不用改配置、也不用重新打包。
#
# ⚠️ 三个前提，缺一个更新链路就不通（2026-09-20 实测 v0.9.0 的 Release 只有两个 exe，
#    `latest.yml` 与 `*.blockmap` 都**不在里面** → 只传 exe 的话渠道是空的）：
#   1. 发版时必须把 **`latest.yml` 与 `*.blockmap` 和 exe 一起作为 Release 资产上传**（同名）；
#   2. Release 必须是**正式发布**（draft / prerelease 都不会被 `latest` 指到）；
#   3. Release 正文写清这版改了什么（`latest.yml` 的 releaseNotes 会显示在「发现新版本」对话框里）。
#
# 代价：国内拉 GitHub 资产偏慢。查版本用的 `latest.yml` 只有几百字节，影响可忽略；
# 差分下载的 blockmap（≈100 MB）会明显慢些 —— 这是本方案唯一的短板。
# 等有了可用支付方式，换回 R2 镜像只需把下面两行改成：
#   provider: generic
#   url: https://dl.smindapp.cn/
# 并**重新打包**（更新地址写在打包生成的 app-update.yml 里，改这里必须重打包才生效）；
# 镜像侧的完整步骤见 docs/release-mirror.md。
publish:
  provider: generic
  url: https://github.com/tun127/SMind/releases/latest/download/
# ---- 代码签名（Azure Trusted Signing，商业化计划选定的方案）----
# 证书开通后设三个环境变量再打包即可，**不用改这份文件**：
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
# 并在此处（win: 之下）加：
#   azureSignOptions:
#     publisherName: <Azure 身份里显示的发布者名，必须逐字一致>
# 没签名时打包照常成功（forceCodeSigning 保持关闭）；签名影响的是 SmartScreen 信誉，
# 与自动更新是否可用互不阻塞——两者别混为一谈。
# 把 .xmind 关联到本软件：装完之后在资源管理器里双击 .xmind 就能直接打开
# （只有**安装版**会注册关联，免安装版没有这一步；不注册的话双击会被系统推给别人或直接报"无法打开"）
fileAssociations:
  - ext: xmind
    name: SMind 思维导图
    description: SMind 思维导图（Xmind 兼容格式）
    icon: build/icon.ico
    role: Editor
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,.github}/**'
  - '!src/**'
  - '!scripts/**'
  - '!samples/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!*.md'
asar: true
win:
  # 由 npm run icon 生成（自绘的多尺寸 ico，含 16/24/32/48/64/128/256）
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 只作为兜底；两个目标各自覆盖，避免它们生成同名文件互相覆盖
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 安装版
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMind
portable:
  # 免安装版（绿色版），与安装版分开放，否则后构建的会覆盖前一个
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
