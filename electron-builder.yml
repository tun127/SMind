appId: com.smind.local
productName: SMind
# ---- 自动更新（electron-updater）----
# 更新渠道 = GitHub Releases（与开源发布是同一个地方）。
# 建好仓库后把 owner/repo 填上并打 tag 发 Release（产物上传 release/*.exe + latest.yml），
# 客户端的「检查更新」才会真的查到东西；没填之前主动检查会明确提示「检查失败」，属预期。
# publish:
#   provider: github
#   owner: 你的GitHub用户名
#   repo: SMind
#   releaseType: release
# ---- 代码签名（Azure Trusted Signing，商业化计划选定的方案）----
# 证书开通后设三个环境变量再打包即可，**不用改这份文件**：
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
# 并在此处（win: 之下）加：
#   azureSignOptions:
#     publisherName: <Azure 身份里显示的发布者名，必须逐字一致>
# 没签名时打包照常成功（forceCodeSigning 保持关闭）；签名影响的是 SmartScreen 信誉，
# 与自动更新是否可用互不阻塞——两者别混为一谈。
# 把 .xmind 关联到本软件：装完之后在资源管理器里双击 .xmind 就能直接打开
# （只有**安装版**会注册关联，免安装版没有这一步；不注册的话双击会被系统推给别人或直接报"无法打开"）
fileAssociations:
  - ext: xmind
    name: SMind 思维导图
    description: SMind 思维导图（Xmind 兼容格式）
    icon: build/icon.ico
    role: Editor
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,.github}/**'
  - '!src/**'
  - '!scripts/**'
  - '!samples/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!*.md'
asar: true
win:
  # 由 npm run icon 生成（自绘的多尺寸 ico，含 16/24/32/48/64/128/256）
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 只作为兜底；两个目标各自覆盖，避免它们生成同名文件互相覆盖
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 安装版
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMind
portable:
  # 免安装版（绿色版），与安装版分开放，否则后构建的会覆盖前一个
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
