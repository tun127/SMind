appId: com.smind.local
productName: SMind
# 把 .xmind 关联到本软件：装完之后在资源管理器里双击 .xmind 就能直接打开
# （只有**安装版**会注册关联，免安装版没有这一步；不注册的话双击会被系统推给别人或直接报"无法打开"）
fileAssociations:
  - ext: xmind
    name: SMind 思维导图
    description: SMind 思维导图（Xmind 兼容格式）
    icon: build/icon.ico
    role: Editor
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,.github}/**'
  - '!src/**'
  - '!scripts/**'
  - '!samples/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!*.md'
asar: true
win:
  # 由 npm run icon 生成（自绘的多尺寸 ico，含 16/24/32/48/64/128/256）
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 只作为兜底；两个目标各自覆盖，避免它们生成同名文件互相覆盖
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 安装版
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMind
portable:
  # 免安装版（绿色版），与安装版分开放，否则后构建的会覆盖前一个
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
